name: Supabase wach halten
on:
  schedule:
    - cron: "17 6 */3 * *"   # alle 3 Tage um ca. 7 Uhr
  workflow_dispatch:          # Knopf zum Testen (Actions -> Run workflow)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets SUPABASE_URL und SUPABASE_KEY fehlen (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          curl -fsS "${SUPABASE_URL%/}/rest/v1/kalk_dokumente?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" > /dev/null
          echo "Supabase erreichbar"
